server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location = / { return 302 /dashboard/; }
    location /dashboard/ { alias /usr/share/nginx/html/; try_files $uri $uri/ /index.html; }
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /health { proxy_pass http://api:8000; }
}
