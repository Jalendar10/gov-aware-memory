[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govmem"
version = "0.1.0"
description = "Governance-aware adaptive memory for frozen LLMs (Version 1 prototype)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
st = ["sentence-transformers>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
govmem = ["schema.sql", "dashboard/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
